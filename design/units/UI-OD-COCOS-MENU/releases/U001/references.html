<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cocos Android · 设计审核</title>
<style>body{margin:0;padding:24px;background:#eae7df;color:#423b2e;font:16px system-ui,sans-serif}h1{font-size:26px}header{max-width:900px;margin:0 auto 24px}p{line-height:1.6}select{font:inherit;padding:8px;border-radius:8px}section{display:flex;justify-content:center;align-items:flex-start;gap:24px;flex-wrap:wrap}figure{margin:0}figcaption{padding:12px 0;font-size:14px}iframe{display:block;border:1px solid #c7bdab;border-radius:12px;background:#faf7ef}a{color:#66502a}</style></head>
<body><header><h1>Cocos Android 菜单 · 待审设计</h1><p>两幅为同一设计的不同画布高度。可直接操作菜单，也可选择状态。这里只审设计；原生运行和 CI 在工程阶段单独验收。</p>
<label>查看状态 <select id="state"><option value="default">初始菜单 · 无会话</option><option value="resumable">可继续菜单</option><option value="zero-empty">已归零 · 无会话</option><option value="zero-resumable">已归零 · 有会话</option><option value="reset-empty">重置确认 · 无会话</option><option value="reset-resumable">重置确认 · 有会话</option><option value="active">会话画面</option></select></label>
<label style="margin-left:16px"><input id="zero" type="checkbox">弹窗／会话预览 best=0</label><p><a href="brief.md">范围</a> · <a href="handoff.md">交接与允许差异</a> · <a href="expected-copy.json">16 项独立预期</a></p></header>
<section><figure><figcaption>Small Phone · 720×1280 px → 375×667 UI 单位</figcaption><iframe id="small" title="Small Phone design" width="375" height="667" src="index.html?state=default"></iframe></figure>
<figure><figcaption>Medium Phone · 1080×2400 px → 375×833 UI 单位</figcaption><iframe id="regular" title="Medium Phone design" width="375" height="833" src="index.html?state=default"></iframe></figure></section>
<script>const state=document.querySelector('#state'),zero=document.querySelector('#zero');function render(){const url='index.html?state='+encodeURIComponent(state.value)+(zero.checked?'&best=0':'');document.querySelector('#small').src=url;document.querySelector('#regular').src=url}state.onchange=render;zero.onchange=render;</script></body></html>
